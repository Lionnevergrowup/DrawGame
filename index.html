}).observe(_timerModalEl, { attributes: true, attributeFilter: ['class'] });


/* =========================================================================
   Help
   ========================================================================= */
document.getElementById('helpBtn').addEventListener('click', () => openModal('helpModal'));
// Refresh: equivalent to the browser reload button. Needed because iOS
// home-screen-installed apps have no address bar / reload control.
// Flush any pending debounced save first so a stroke saved <350ms ago
// isn't lost in the reload. Append a fresh ?v=timestamp so iOS Safari /
// home-screen-installed apps can't serve a stale cached HTML — plain
// location.reload() reads the cache.
document.getElementById('refreshBtn').addEventListener('click', () => {
  try { savePersisted.flush(); } catch (_) {}
  const url = new URL(location.href);
  url.searchParams.set('v', Date.now());
  location.replace(url.toString());
});
document.getElementById('langToggle').addEventListener('click', toggleLang);

/* =========================================================================
   Background music: soft pentatonic chimes synthesized with Web Audio (no
   audio files, no network). ON by default and starts on the first tap,
   because browsers refuse to make sound before a user gesture. The music
   button mutes it and the choice is remembered (cga_music = '0').

   Rules (each one is a bug we already hit):
   - Exactly ONE scheduling chain, never more. An earlier version let the
     overlapping-note path re-arm its own chain; the chains multiplied, the
     note count grew exponentially and the audio died about a minute in.
   - Hard cap on simultaneously ringing notes (safety net).
   - Nothing plays unless the context is running AND the page is visible;
     all pending timers are cancelled the moment that stops being true, so
     no backlog of notes can burst out later.
   ========================================================================= */
const MUSIC_LS_KEY = 'cga_music';
const MUSIC_MAX_VOICES = 10;
const MUSIC_NOTE_SECS = 1.6;     // bass note length (melody plucks are 1.2s)
const MUSIC_BEAT_MS = 260;       // eighth-note grid, about 115 bpm
// Bright C major pentatonic (C4 D4 E4 G4 A4 C5 D5 E5 G5 A5): cheerful and
// can never clash. The melody takes small random steps, so it hums a tune.
const MUSIC_NOTES = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00];
let musicIdx = 4;
let musicBeat = 0;
const musicBtnEl = document.getElementById('musicBtn');
const musicIconEl = document.getElementById('musicIcon');
let musicWanted = true;
try { musicWanted = localStorage.getItem(MUSIC_LS_KEY) !== '0'; } catch (_) {}
let audioCtx = null;
let musicMaster = null;              // gain bus every note goes through
let musicChain = null;               // timer id of THE scheduling chain (null = stopped)
const musicVoiceEnds = [];           // audio-clock end times of ringing notes

function musicEnsureAudio() {
  if (audioCtx) return audioCtx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  try { audioCtx = new AC(); } catch (_) { return null; }
  audioCtx.onstatechange = musicOnState;   // iOS may interrupt / suspend us
  // iOS: the hardware silent switch mutes Web Audio unless the page declares
  // a playback audio session (Safari 16.4+). Harmless on other browsers.
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (_) {}
  return audioCtx;
}
function musicShouldPlay() {
  return musicWanted && !!audioCtx && audioCtx.state === 'running' &&
         document.visibilityState === 'visible';
}
// Play ONE note. Never schedules anything.
function musicTrigger(freqOverride, secs, peakOverride) {
  const ctx = audioCtx;
  if (!ctx || !musicMaster) return;
  const t0 = ctx.currentTime;
  while (musicVoiceEnds.length && musicVoiceEnds[0] <= t0) musicVoiceEnds.shift();
  if (musicVoiceEnds.length >= MUSIC_MAX_VOICES) return;
  let freq = freqOverride;
  if (!freq) {
    musicIdx = Math.max(0, Math.min(MUSIC_NOTES.length - 1, musicIdx + Math.floor(Math.random() * 5) - 2));
    freq = MUSIC_NOTES[musicIdx];
  }
  const len = secs || 1.2;
  // Sine plus a soft triangle one octave down: warm, not a beep.
  const sine = ctx.createOscillator();
  const tri  = ctx.createOscillator();
  const gain = ctx.createGain();
  sine.type = 'sine';      sine.frequency.value = freq;
  tri.type  = 'triangle';  tri.frequency.value  = freq / 2;
  const peak = peakOverride || (0.045 + Math.random() * 0.015);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peak, t0 + 0.012);   // quick pluck attack
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + len);
  sine.connect(gain); tri.connect(gain); gain.connect(musicMaster);
  sine.start(t0);                 tri.start(t0);
  sine.stop(t0 + len + 0.05); tri.stop(t0 + len + 0.05);
  musicVoiceEnds.push(t0 + len + 0.05);
}
// THE single scheduling chain: one tick per eighth note.
function musicTick() {
  musicChain = null;                         // the timer that called us has fired
  if (!musicShouldPlay()) return;            // musicSync() restarts us when allowed
  const beat = musicBeat++ % 16;
  if (beat % 8 === 0) musicTrigger(MUSIC_NOTES[0] / 2, MUSIC_NOTE_SECS, 0.05);   // soft low bass on the downbeat
  if (beat % 4 === 0 || Math.random() < 0.6) musicTrigger();                      // melody, with the odd rest
  musicChain = setTimeout(musicTick, MUSIC_BEAT_MS);
}
// Make actual playback match the desired state.
function musicSync() {
  if (musicShouldPlay()) {
    if (!musicMaster) {
      musicMaster = audioCtx.createGain();
      musicMaster.gain.value = 0;
      musicMaster.connect(audioCtx.destination);
      musicMaster.gain.setTargetAtTime(1, audioCtx.currentTime, 0.05);   // fade in, no click
    }
    if (musicChain === null) musicTick();
  } else {
    if (musicChain !== null) { clearTimeout(musicChain); musicChain = null; }
    if (musicMaster) {
      const bus = musicMaster; musicMaster = null;
      try { bus.gain.cancelScheduledValues(0); bus.gain.setTargetAtTime(0, audioCtx.currentTime, 0.04); } catch (_) {}
      setTimeout(() => { try { bus.disconnect(); } catch (_) {} }, 400);   // ringing tails die with the bus
    }
  }
  musicUpdateBtn();
}
function musicUpdateBtn() {
  musicIconEl.textContent = musicWanted ? '🎵' : '🔇';
  const k = musicWanted ? 'musicOn' : 'musicOff';
  musicBtnEl.setAttribute('data-i18n-title', k);
  musicBtnEl.title = t(k);
}
function musicOnState() {
  musicSync();
  if (!audioCtx) return;
  if (audioCtx.state === 'running') musicDisarmUnlock();
  else if (musicWanted) musicArmUnlock();    // blocked / interrupted: next tap resumes
}
// Must run inside a user gesture (tap / key).
function musicUnlock() {
  if (!musicEnsureAudio()) return;
  let p = null;
  try { p = audioCtx.resume(); } catch (_) {}
  // Older iOS only unlocks output after a (silent) buffer plays inside the gesture.
  try {
    const src = audioCtx.createBufferSource();
    src.buffer = audioCtx.createBuffer(1, 1, 22050);
    src.connect(audioCtx.destination);
    src.start(0);
  } catch (_) {}
  if (p && p.then) p.then(musicOnState, musicOnState); else musicOnState();
}
const MUSIC_UNLOCK_EVENTS = ['pointerup', 'touchend', 'click', 'keydown'];
let musicUnlockArmed = false;
function musicOnGesture(e) {
  if (!musicWanted) return;
  if (e && e.target && e.target.closest && e.target.closest('#musicBtn')) return;  // button has its own handler
  musicUnlock();
}
function musicArmUnlock() {
  if (musicUnlockArmed) return;
  musicUnlockArmed = true;
  MUSIC_UNLOCK_EVENTS.forEach(ev => document.addEventListener(ev, musicOnGesture, { capture: true, passive: true }));
}
function musicDisarmUnlock() {
  if (!musicUnlockArmed) return;
  musicUnlockArmed = false;
  MUSIC_UNLOCK_EVENTS.forEach(ev => document.removeEventListener(ev, musicOnGesture, { capture: true }));
}
musicBtnEl.addEventListener('click', () => {
  // Audible -> mute. Anything else (muted, or on but still waiting for a
  // first tap) -> on, and this tap is the gesture that unlocks audio.
  const wasAudible = musicWanted && musicChain !== null;
  musicWanted = !wasAudible;
  try { localStorage.setItem(MUSIC_LS_KEY, musicWanted ? '1' : '0'); } catch (_) {}
  if (musicWanted) musicUnlock(); else musicSync();
});
document.addEventListener('visibilitychange', musicSync);
musicUpdateBtn();
if (musicWanted) musicArmUnlock();

// "Start over" — wipe every app key from localStorage and reload, so the
// user gets the first-visit flow (help → picker → timer setup) fresh.
async function doResetAll() {
  if (!(await askConfirm(t('resetAllConfirm')))) return;
  // Cancel any pending debounced save and flip the kill switch BEFORE
  // wiping LS, so a stroke saved 100ms ago doesn't fire its 350ms-debounced
  // savePersisted between the wipe and the reload — which would restore
  // the colors we just nuked.
  __resetting = true;
  savePersisted.cancel();
  try {
    // Nuke ONLY our own keys (cga_*) so we don't wreck other sites — and
    // intentionally including cga_help_seen / cga_timer_intro_seen so the
    // reload behaves like a brand-new visitor: help modal → picker → timer
    // setup. No sessionStorage shortcut.
    const toRemove = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('cga_')) toRemove.push(k);
    }
    toRemove.forEach(k => localStorage.removeItem(k));
  } catch (_) {}
  showToast(t('resetAllDone'), 1500);
  setTimeout(() => location.reload(), 600);
}
document.getElementById('resetAllBtn').addEventListener('click', doResetAll);
document.getElementById('resetCacheBtn').addEventListener('click', doResetAll);

/* =========================================================================
   Boot
   ========================================================================= */
loadPersisted();
// Saved state from older app versions can be missing newer fields; re-run
// normalization so the timer chip + modal show coherent values.
normalizeTimerState();
buildPalette();
selectColor(state.color, /*fromRecent=*/true);  // boot restore: don't touch the saved recents
renderRecentColors();
buildPatternTiles();
updatePatternDefs();
updateBrushPreview();
brushSizeInput.value = state.brushSize;
stampSizeInput.value = state.stampSize;
stampSizeText.textContent = state.stampSize;
setTool(state.tool, /*openStampPicker=*/false);   // restore — don't pop the stamp modal at boot
loadPage(state.pageKey);
applyView();
tickTimer();
applyI18n();

// Flush autosave when the tab becomes hidden or the page is unloaded
// (otherwise the debounced save might never fire if the user navigates
// away within 350 ms of their last change).
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') savePersisted.flush();
});
window.addEventListener('pagehide', () => savePersisted.flush());

// Auto-open the picture picker as the first screen (after help on first visit).
function openPickerAfterBoot() {
  buildPictureCatTabs();
  buildPictureGrid();
  openModal('pictureModal');
}
// First-run: help, then picker. Returning visit: jump straight to picker.
// (Reset wipes cga_help_seen too, so post-reset re-runs this first-visit path.)
try {
  if (!localStorage.getItem('cga_help_seen')) {
    openModal('helpModal');
    // When user closes help, mark seen + open picker. Setting the LS flag
    // only on close means a reload-during-help still re-shows help next time.
    const helpModal = document.getElementById('helpModal');
    const obs = new MutationObserver(() => {
      if (!helpModal.classList.contains('show')) {
        obs.disconnect();
        try { localStorage.setItem('cga_help_seen', '1'); } catch (_) {}
        setTimeout(openPickerAfterBoot, 250);
      }
    });
    obs.observe(helpModal, { attributes: true, attributeFilter: ['class'] });
  } else {
    setTimeout(openPickerAfterBoot, 100);
  }
} catch (_) { openPickerAfterBoot(); }

</script>
</body>
</html>
